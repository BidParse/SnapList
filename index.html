<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SimpleList</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white p-4 sm:p-8 font-sans min-h-screen flex flex-col items-center">
    <div class="w-full max-w-2xl bg-[#111111] border border-purple-900 p-6 sm:p-10 rounded-xl shadow-[0_0_20px_rgba(128,0,128,0.3)]">
        
        <div class="text-center mb-8">
            <h1 class="text-5xl sm:text-6xl font-black tracking-wide mb-4"><span class="text-purple-600">Simple</span><span class="text-white">List</span></h1>
            <p class="text-xs text-[#C0C0C0] tracking-widest uppercase">AI Marketplace Generator</p>
        </div>

        <div id="main-nav" class="hidden flex gap-2 mb-8 p-1 bg-black border border-purple-900/50 rounded-md">
            <button onclick="showSection('generator-section')" id="tab-generator" class="flex-1 py-3 text-sm font-bold uppercase tracking-wider rounded bg-purple-900/50 text-white transition-colors">Generator</button>
            <button onclick="showSection('profile-section')" id="tab-profile" class="flex-1 py-3 text-sm font-bold uppercase tracking-wider rounded hover:bg-purple-900/30 text-gray-400 transition-colors">My Profile</button>
            <button onclick="handleLogout()" class="flex-1 py-3 text-sm font-bold uppercase tracking-wider rounded hover:bg-red-900/30 text-red-400 transition-colors">Logout</button>
        </div>

        <div id="auth-section" class="mb-8 pb-8 text-center">
            <h2 class="text-xl mb-6 font-bold text-purple-400 uppercase tracking-wide">Account Access</h2>
            <input type="email" id="email" placeholder="Email Address" class="bg-black border border-purple-800 text-white p-4 w-full mb-4 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500">
            <input type="password" id="password" placeholder="Password" class="bg-black border border-purple-800 text-white p-4 w-full mb-2 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500">
            <p class="text-xs text-gray-500 mb-6 text-left pl-1">Requirement: Password must be at least 6 characters long.</p>
            
            <div class="flex gap-4">
                <button onclick="handleLogin()" class="bg-purple-600 text-white font-black uppercase tracking-wider px-4 py-3 rounded-md flex-1 hover:bg-purple-500 transition-colors">Login</button>
                <button onclick="handleSignUp()" class="bg-black border border-purple-600 text-purple-500 font-black uppercase tracking-wider px-4 py-3 rounded-md flex-1 hover:bg-purple-900/30 transition-colors">Sign Up</button>
            </div>
            
            <div class="mt-6">
                <button onclick="handleResetPasswordRequest()" class="text-xs text-purple-400 hover:text-purple-300 transition-colors uppercase tracking-widest font-bold">Forgot Password?</button>
            </div>
            <p id="auth-message" class="mt-5 text-sm font-bold whitespace-pre-wrap"></p>
        </div>

        <div id="recovery-section" class="hidden mb-8 text-center border border-green-900 bg-[#051105] p-8 rounded-md shadow-[0_0_15px_rgba(0,255,0,0.1)]">
            <h2 class="text-2xl mb-2 font-bold text-green-400 uppercase tracking-wide">Reset Password</h2>
            <p class="text-sm text-green-200/70 mb-6">Enter your new secure password below.</p>
            
            <input type="password" id="new-password" placeholder="New Password" class="bg-black border border-green-800 text-white p-4 w-full mb-2 rounded-md focus:outline
