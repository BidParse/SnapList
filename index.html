<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapList</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded shadow-lg">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">SnapList</h1>

        <!-- Auth Section -->
        <div id="auth-section" class="mb-8 pb-6 border-b">
            <h2 class="text-xl mb-4 font-semibold">Login / Sign Up</h2>
            <input type="email" id="email" placeholder="Email Address" class="border p-2 w-full mb-3 rounded">
            <input type="password" id="password" placeholder="Password" class="border p-2 w-full mb-3 rounded">
            <div class="flex gap-2">
                <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded flex-1 hover:bg-blue-600">Login</button>
                <button onclick="signUp()" class="bg-gray-800 text-white px-4 py-2 rounded flex-1 hover:bg-gray-900">Sign Up</button>
            </div>
            <p id="auth-message" class="text-red-500 mt-3 text-sm text-center"></p>
        </div>

        <!-- Logged In Section (Hidden by default) -->
        <div id="app-section" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-gray-50 p-3 rounded">
                <p class="text-sm">Logged in as: <span id="user-email" class="font-bold"></span></p>
                <button onclick="logout()" class="text-red-500 text-sm hover:underline">Logout</button>
            </div>

            <!-- Pro Upgrade Banner -->
            <div class="mb-8 p-4 bg-yellow-50 border border-yellow-200 rounded flex justify-between items-center">
                <div>
                    <h3 class="font-bold text-yellow-800">SnapList Pro</h3>
                    <p class="text-sm text-yellow-700">Upgrade for unlimited listings and features!</p>
                </div>
                <button onclick="checkout()" class="bg-yellow-500 text-white px-4 py-2 rounded font-bold hover:bg-yellow-600">Upgrade - $9.99</button>
            </div>

            <!-- Generator Section -->
            <div class="mb-4">
                <h2 class="text-xl mb-4 font-semibold">Create a New Listing</h2>
                <div class="border-2 border-dashed border-gray-300 p-6 text-center rounded mb-4">
                    <input type="file" id="image-upload" accept="image/*" class="w-full cursor-pointer">
                </div>
                <button onclick="generateListing()" class="bg-purple-500 text-white px-4 py-3 rounded w-full font-bold hover:bg-purple-600 text-lg">Generate AI Listing</button>
            </div>

            <div id="result" class="mt-6 p-4 border rounded bg-gray-50 hidden whitespace-pre-wrap">
                <!-- AI Results load here -->
            </div>
        </div>
    </div>

    <script>
        // --- DATABASE CONNECTION ---
        const SUPABASE_URL = 'https://wzmaaahyovsroeyjsmst.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7HpG3z67MVak6k9csFWmKQ_7MLqrMyP'; 
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // --- AUTHENTICATION LOGIC ---
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = currentUser.email;
            } else {
                currentUser = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('auth-message');
            messageEl.innerText = "Signing up...";
            messageEl.className = "text-blue-500 mt-3 text-sm text-center";
            
            const { data, error } = await supabase.auth.signUp({ email, password });
            
            if (error) {
                messageEl.innerText = error.message;
                messageEl.className = "text-red-500 mt-3 text-sm text-center";
            } else {
                messageEl.innerText = "Success! Please log in now.";
                messageEl.className = "text-green-500 mt-3 text-sm text-center";
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('auth-message');
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                messageEl.innerText = error.message;
                messageEl.className = "text-red-500 mt-3 text-sm text-center";
            } else {
                messageEl.innerText = "";
                checkUser();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            checkUser();
        }

        // --- STRIPE CHECKOUT LOGIC ---
        async function checkout() {
            if (!currentUser) return alert("Please log in first!");
            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id })
                });
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url; // Send user to Stripe
                } else {
                    alert("Error starting checkout");
                }
            } catch (err) {
                alert("Payment system unavailable right now.");
            }
        }

        // --- GEMINI AI GENERATION LOGIC ---
        async function generateListing() {
            const fileInput = document.getElementById('image-upload');
            const resultBox = document.getElementById('result');
            
            if (!fileInput.files.length) {
                return alert("Please select an image first!");
            }
            
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            resultBox.classList.remove('hidden');
            resultBox.innerText = "Analyzing image and writing listing... ⏳";

            try {
                const response = await fetch('/api/generate-listing', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.result) {
                    resultBox.innerText = data.result;
                } else {
                    resultBox.innerText = "Error: " + JSON.stringify(data.error);
                }
            } catch (e) {
                resultBox.innerText = "A connection error occurred.";
            }
        }

        // Run on startup
        checkUser();
    </script>
</body>
</html>
