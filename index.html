<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplyList</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-gray-200 p-8 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto bg-gray-900 border border-gray-700 p-8 rounded-xl shadow-2xl">
        
        <!-- Camera Icon & Branding -->
        <div class="text-center mb-8">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-16 h-16 mx-auto mb-3 text-gray-400">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 0 1 5.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 0 0 2.25 2.25h15A2.25 2.25 0 0 0 21.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 0 0-1.134-.175 2.31 2.31 0 0 1-1.64-1.055l-.822-1.316a2.192 2.192 0 0 0-1.736-1.039 48.774 48.774 0 0 0-5.232 0 2.192 2.192 0 0 0-1.736 1.039l-.821 1.316Z" />
              <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0ZM18.75 10.5h.008v.008h-.008V10.5Z" />
            </svg>
            <h1 class="text-4xl font-bold tracking-wider text-white">SimplyList</h1>
            <p class="text-sm text-gray-400 mt-1">AI-Powered Marketplace Generation</p>
        </div>

        <!-- Auth Section -->
        <div id="auth-section" class="mb-8 pb-8 border-b border-gray-700">
            <h2 class="text-xl mb-4 font-semibold text-gray-300">Access Your Account</h2>
            <input type="email" id="email" placeholder="Email Address" class="bg-gray-800 border border-gray-600 text-white p-3 w-full mb-3 rounded focus:outline-none focus:border-gray-400">
            <input type="password" id="password" placeholder="Password" class="bg-gray-800 border border-gray-600 text-white p-3 w-full mb-4 rounded focus:outline-none focus:border-gray-400">
            <div class="flex gap-3">
                <button onclick="login()" class="bg-gray-200 text-black font-bold px-4 py-2 rounded flex-1 hover:bg-white transition">Login</button>
                <button onclick="signUp()" class="bg-gray-700 text-white font-bold px-4 py-2 rounded flex-1 hover:bg-gray-600 transition">Sign Up</button>
            </div>
            <p id="auth-message" class="mt-4 text-sm text-center font-semibold"></p>
        </div>

        <!-- Logged In Section (Hidden by default) -->
        <div id="app-section" class="hidden">
            <div class="flex justify-between items-center mb-8 bg-gray-800 p-4 rounded border border-gray-700">
                <p class="text-sm text-gray-300">User: <span id="user-email" class="font-bold text-white"></span></p>
                <button onclick="logout()" class="text-gray-400 text-sm hover:text-white transition">Logout</button>
            </div>

            <!-- Pro Upgrade Banner -->
            <div class="mb-8 p-5 bg-gradient-to-r from-gray-800 to-gray-700 border border-gray-500 rounded-lg flex justify-between items-center shadow-md">
                <div>
                    <h3 class="font-bold text-lg text-white">SimplyList Pro</h3>
                    <p class="text-sm text-gray-300">Unlock unlimited generations.</p>
                </div>
                <button onclick="checkout()" class="bg-gray-200 text-black px-5 py-2 rounded font-bold hover:bg-white transition shadow">Upgrade - $9.99</button>
            </div>

            <!-- Generator Section -->
            <div>
                <h2 class="text-xl mb-4 font-semibold text-white">New Listing</h2>
                <div class="border-2 border-dashed border-gray-600 hover:border-gray-400 transition bg-gray-800 p-8 text-center rounded mb-4">
                    <input type="file" id="image-upload" accept="image/*" class="w-full cursor-pointer text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-gray-700 file:text-gray-200 hover:file:bg-gray-600">
                </div>
                <button onclick="generateListing()" class="bg-white text-black px-4 py-3 rounded w-full font-bold hover:bg-gray-200 text-lg transition shadow-lg">Generate AI Listing</button>
            </div>

            <div id="result" class="mt-6 p-5 border border-gray-600 rounded bg-gray-800 hidden whitespace-pre-wrap text-gray-200 font-mono text-sm shadow-inner">
                <!-- AI Results load here -->
            </div>
        </div>
    </div>

    <script>
        // --- DATABASE CONNECTION ---
        const SUPABASE_URL = 'https://wzmaaahyovsroeyjsmst.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7HpG3z67MVak6k9csFWmKQ_7MLqrMyP'; 
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // --- AUTHENTICATION LOGIC ---
        async function checkUser() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = currentUser.email;
            } else {
                currentUser = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('auth-message');
            messageEl.innerText = "Signing up...";
            messageEl.className = "mt-4 text-sm text-center font-semibold text-gray-400";
            
            const { data, error } = await supabase.auth.signUp({ email, password });
            
            if (error) {
                messageEl.innerText = error.message;
                messageEl.className = "mt-4 text-sm text-center font-semibold text-red-400";
            } else {
                messageEl.innerText = "Success! Please click Login.";
                messageEl.className = "mt-4 text-sm text-center font-semibold text-green-400";
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('auth-message');
            messageEl.innerText = "Logging in...";
            messageEl.className = "mt-4 text-sm text-center font-semibold text-gray-400";
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                messageEl.innerText = error.message;
                messageEl.className = "mt-4 text-sm text-center font-semibold text-red-400";
            } else {
                messageEl.innerText = "";
                checkUser();
            }
        }

        async function logout() {
            await supabase.auth.signOut();
            checkUser();
        }

        // --- STRIPE CHECKOUT LOGIC ---
        async function checkout() {
            if (!currentUser) return alert("Please log in first!");
            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id })
                });
                const data = await response.json();
                if (data.url) {
                    window.location.href = data.url; 
                } else {
                    alert("Error starting checkout: " + (data.detail || "Unknown error"));
                }
            } catch (err) {
                alert("Payment system unavailable right now.");
            }
        }

        // --- GEMINI AI GENERATION LOGIC ---
        async function generateListing() {
            const fileInput = document.getElementById('image-upload');
            const resultBox = document.getElementById('result');
            
            if (!fileInput.files.length) {
                return alert("Please select an image first!");
            }
            
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);

            resultBox.classList.remove('hidden');
            resultBox.innerText = "Analyzing image and writing listing... ⏳";

            try {
                const response = await fetch('/api/generate-listing', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.result) {
                    resultBox.innerText = data.result;
                } else {
                    resultBox.innerText = "Error: " + JSON.stringify(data.error);
                }
            } catch (e) {
                resultBox.innerText = "A connection error occurred.";
            }
        }

        // Run on startup
        checkUser();
    </script>
</body>
</html>
