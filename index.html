<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplyList - Multi-Channel AI Lister</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-gray-900 rounded-3xl shadow-2xl border border-purple-900/40 overflow-hidden flex flex-col">
        <!-- Header -->
        <div class="bg-black/80 px-6 py-4 flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center space-x-2">
                <svg class="w-6 h-6 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="text-lg font-bold tracking-tight text-white">Simply<span class="text-purple-400">List</span></span>
            </div>
        </div>

        <!-- Form Area -->
        <div class="p-6 flex-1 flex flex-col space-y-6">
            <form id="uploadForm" class="space-y-4">
                <div class="w-full bg-gray-800/80 rounded-2xl p-4 border border-purple-500/30 flex flex-col items-center justify-center relative shadow-inner min-h-[160px]">
                    <!-- Image Preview Thumbnail -->
                    <img id="imagePreview" class="hidden w-full h-40 object-cover rounded-xl mb-2 border border-purple-500/50" alt="Product Preview">
                    
                    <!-- Default Upload Prompt -->
                    <div id="uploadPlaceholder" class="flex flex-col items-center justify-center py-4">
                        <svg class="w-12 h-12 text-purple-400 mb-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        <span class="text-sm text-gray-300 font-medium">Upload Product Photo</span>
                        <span id="fileName" class="text-xs text-purple-400 mt-1"></span>
                    </div>

                    <input type="file" id="imageInput" accept="image/*" required class="absolute inset-0 opacity-0 cursor-pointer">
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition duration-200">
                    Generate All Major Listings
                </button>
            </form>

            <div id="loading" class="hidden text-center text-purple-400 animate-pulse font-medium text-sm">
                Crafting optimized listings for eBay, Poshmark, FB, Mercari, Depop, Grailed, & Vinted...
            </div>

            <!-- Multi-Platform Results Section -->
            <div id="resultContainer" class="hidden space-y-4 pt-4 border-t border-gray-800">
                <div class="flex space-x-1.5 border-b border-gray-800 pb-2 overflow-x-auto">
                    <button onclick="switchTab('ebay')" id="btn-ebay" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-purple-600 text-white whitespace-nowrap">eBay</button>
                    <button onclick="switchTab('poshmark')" id="btn-poshmark" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-400 whitespace-nowrap">Poshmark</button>
                    <button onclick="switchTab('facebook')" id="btn-facebook" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-400 whitespace-nowrap">Facebook</button>
                    <button onclick="switchTab('mercari')" id="btn-mercari" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-400 whitespace-nowrap">Mercari</button>
                    <button onclick="switchTab('depop')" id="btn-depop" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-400 whitespace-nowrap">Depop</button>
                    <button onclick="switchTab('grailed')" id="btn-grailed" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-400 whitespace-nowrap">Grailed</button>
                    <button onclick="switchTab('vinted')" id="btn-vinted" class="px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-400 whitespace-nowrap">Vinted</button>
                </div>

                <div id="tab-content" class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Title</label>
                        <div id="resTitle" class="bg-gray-800 p-2.5 rounded-lg text-gray-200 text-sm select-all border border-gray-700"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Price</label>
                        <div id="resPrice" class="bg-gray-800 p-2.5 rounded-lg text-purple-400 font-bold text-sm select-all border border-gray-700"></div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Description</label>
                        <div id="resDesc" class="bg-gray-800 p-2.5 rounded-lg text-gray-300 text-xs select-all whitespace-pre-wrap border border-gray-700 max-h-32 overflow-y-auto"></div>
                    </div>

                    <!-- Direct Action / Post Button -->
                    <button id="postBtn" onclick="openPlatformListing()" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition duration-200 text-sm flex items-center justify-center space-x-2">
                        <span>Copy & Open Platform to List</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let parsedData = { ebay: {}, poshmark: {}, facebook: {}, mercari: {}, depop: {}, grailed: {}, vinted: {} };
        let currentPlatform = 'ebay';

        const platformUrls = {
            ebay: 'https://www.ebay.com/sl/sell',
            poshmark: 'https://poshmark.com/create-listing',
            facebook: 'https://www.facebook.com/marketplace/create/item',
            mercari: 'https://www.mercari.com/sell/',
            depop: 'https://www.depop.com/products/create/',
            grailed: 'https://www.grailed.com/listings/new',
            vinted: 'https://www.vinted.com/items/new'
        };

        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const uploadPlaceholder = document.getElementById('uploadPlaceholder');
        const fileName = document.getElementById('fileName');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const submitBtn = document.getElementById('submitBtn');

        // Instant Preview Trigger on File Selection
        fileInput.addEventListener('change', (e) => {
            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];
            
            imagePreview.src = URL.createObjectURL(file);
            imagePreview.classList.remove('hidden');
            uploadPlaceholder.classList.add('hidden');
            fileName.innerText = file.name;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('image_file', fileInput.files[0]);

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/generate-listing', { method: 'POST', body: formData });
                const data = await response.json();
                parseAIResponse(data.listing);
                switchTab('ebay');
                resultContainer.classList.remove('hidden');
            } catch (err) {
                alert('Error generating listings.');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        function parseAIResponse(text) {
            const platforms = ['ebay', 'poshmark', 'facebook', 'mercari', 'depop', 'grailed', 'vinted'];
            platforms.forEach((plat, index) => {
                const nextPlat = platforms[index + 1];
                const regexPattern = nextPlat 
                    ? `${plat.toUpperCase()}:([\\s\\S]*?)(?=${nextPlat.toUpperCase()}:)` 
                    : `${plat.toUpperCase()}:([\\s\\S]*)`;
                const regex = new RegExp(regexPattern, 'i');
                const match = text.match(regex);
                const block = match ? match[1] : text;
                
                parsedData[plat] = {
                    title: block.match(/TITLE:\s*(.*)/i)?.[1] || "N/A",
                    price: block.match(/PRICE:\s*(.*)/i)?.[1] || "Market rate",
                    desc: block.match(/DESC:\s*([\s\S]*)/i)?.[1] || block
                };
            });
        }

        function switchTab(plat) {
            currentPlatform = plat;
            ['ebay', 'poshmark', 'facebook', 'mercari', 'depop', 'grailed', 'vinted'].forEach(p => {
                const btn = document.getElementById(`btn-${p}`);
                if (p === plat) {
                    btn.className = "px-2.5 py-1.5 text-xs font-bold rounded-lg bg-purple-600 text-white whitespace-nowrap";
                } else {
                    btn.className = "px-2.5 py-1.5 text-xs font-bold rounded-lg bg-gray-800 text-gray-400 whitespace-nowrap";
                }
            });
            document.getElementById('resTitle').innerText = parsedData[plat].title;
            document.getElementById('resPrice').innerText = parsedData[plat].price;
            document.getElementById('resDesc').innerText = parsedData[plat].desc;
            document.getElementById('postBtn').innerText = `Copy & Open ${plat.toUpperCase()} to List`;
        }

        function openPlatformListing() {
            const current = parsedData[currentPlatform];
            const payload = `Title: ${current.title}\nPrice: ${current.price}\n\nDescription:\n${current.desc}`;
            
            navigator.clipboard.writeText(payload).then(() => {
                alert(`Copied ${currentPlatform.toUpperCase()} listing to clipboard! Opening ${currentPlatform.toUpperCase()}...`);
                window.open(platformUrls[currentPlatform], '_blank');
            }).catch(err => {
                alert('Failed to copy text. Please select and copy manually.');
            });
        }
    </script>
</body>
</html>
