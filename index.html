
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplyList - AI Product Lister</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-md w-full bg-gray-900 rounded-3xl shadow-2xl border border-purple-900/40 overflow-hidden flex flex-col">
        <!-- Top Header Bar -->
        <div class="bg-black/80 px-6 py-4 flex items-center justify-between border-b border-gray-800">
            <div class="flex items-center space-x-2">
                <!-- Custom Camera Icon -->
                <svg class="w-6 h-6 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span class="text-lg font-bold tracking-tight text-white">Simply<span class="text-purple-400">List</span></span>
            </div>
            <div class="flex items-center space-x-3 text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </div>
        </div>

        <!-- Central Interactive Scan Card -->
        <div class="p-6 flex-1 flex flex-col items-center justify-center space-y-6">
            <div class="w-full bg-gray-800/80 rounded-2xl p-6 border border-purple-500/30 flex flex-col items-center justify-center relative shadow-inner min-h-[220px]">
                <svg class="w-16 h-16 text-purple-400 mb-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 13l2 2 4-4" stroke-width="2"></path>
                </svg>
                <span class="text-white font-semibold text-lg tracking-wide">Simply<span class="text-purple-400">List</span></span>
                <span class="text-xs text-gray-400 mt-1">Tap or Upload Item to Scan</span>
                
                <!-- Hidden Real File Input Overlay -->
                <form id="uploadForm" class="absolute inset-0 opacity-0 cursor-pointer">
                    <input type="file" id="imageInput" accept="image/*" required class="w-full h-full cursor-pointer">
                </form>
            </div>

            <!-- Action Buttons Grid -->
            <div class="grid grid-cols-2 gap-4 w-full">
                <button type="button" onclick="document.getElementById('imageInput').click()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm font-medium text-gray-200 transition">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path></svg>
                    <span>Scan Barcode</span>
                </button>
                <button type="button" onclick="document.getElementById('imageInput').click()" class="bg-gray-800 hover:bg-gray-700 border border-gray-700 py-3 px-4 rounded-xl flex items-center justify-center space-x-2 text-sm font-medium text-gray-200 transition">
                    <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span>Gallery Upload</span>
                </button>
            </div>

            <button id="submitBtn" form="uploadForm" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 text-center">
                Analyze & List
            </button>

            <div id="loading" class="hidden text-center text-purple-400 animate-pulse font-medium text-sm">
                Analyzing product photo with AI...
            </div>

            <!-- Results Output -->
            <div id="resultContainer" class="hidden w-full space-y-3 pt-4 border-t border-gray-800">
                <h2 class="text-lg font-bold text-white">Generated Listing</h2>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Title</label>
                    <div id="resTitle" class="bg-gray-800 p-2.5 rounded-lg text-gray-200 text-sm select-all border border-gray-700"></div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Price Estimate</label>
                    <div id="resPrice" class="bg-gray-800 p-2.5 rounded-lg text-purple-400 font-bold text-sm select-all border border-gray-700"></div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Description</label>
                    <div id="resDesc" class="bg-gray-800 p-2.5 rounded-lg text-gray-300 text-xs select-all whitespace-pre-wrap border border-gray-700 max-h-32 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const fileInput = document.getElementById('imageInput');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const submitBtn = document.getElementById('submitBtn');

        fileInput.addEventListener('change', async () => {
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('image_file', fileInput.files[0]);

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/generate-listing', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                const text = data.listing;
                document.getElementById('resTitle').innerText = text.match(/TITLE:\s*(.*)/i)?.[1] || "See description";
                document.getElementById('resPrice').innerText = text.match(/PRICE ESTIMATE:\s*(.*)/i)?.[1] || "Market rate";
                document.getElementById('resDesc').innerText = text.match(/DESCRIPTION:\s*([\s\S]*)/i)?.[1] || text;

                resultContainer.classList.remove('hidden');
            } catch (err) {
                alert('Error generating listing. Please try again.');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
