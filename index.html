<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleList</title>
    <!-- Tailwind CSS is loaded here to give it the dark mode styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white p-8 font-sans min-h-screen flex flex-col items-center">
    <div class="w-full max-w-2xl bg-[#111111] border border-purple-900 p-10 rounded-xl shadow-[0_0_20px_rgba(128,0,128,0.3)]">
        
        <div class="text-center mb-10">
            <h1 class="text-6xl font-black tracking-wide mb-6"><span class="text-purple-600">Simple</span><span class="text-white">List</span></h1>
            <img src="logo.png" alt="SimpleList Logo" class="h-40 mx-auto object-contain drop-shadow-[0_0_15px_rgba(147,51,234,0.3)]">
            <p class="text-sm text-[#C0C0C0] mt-6 tracking-widest uppercase">AI Marketplace Generator</p>
        </div>

        <div id="auth-section" class="mb-8 pb-8 border-b border-purple-900/50">
            <h2 class="text-xl mb-4 font-bold text-purple-400 uppercase tracking-wide">Account Access</h2>
            <input type="email" id="email" placeholder="Email Address" class="bg-black border border-purple-800 text-white p-4 w-full mb-4 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500">
            
            <!-- We adjusted the margin here so the hint text sits snug beneath it -->
            <input type="password" id="password" placeholder="Password" class="bg-black border border-purple-800 text-white p-4 w-full mb-2 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500">
            
            <!-- NEW: Password requirements hint -->
            <p class="text-xs text-gray-500 mb-6 text-left pl-1">Requirement: Password must be at least 6 characters long.</p>
            
            <div class="flex gap-4">
                <button onclick="login()" class="bg-purple-600 text-white font-black uppercase tracking-wider px-4 py-3 rounded-md flex-1 hover:bg-purple-500 transition-colors duration-200">Login</button>
                <button onclick="signUp()" class="bg-black border border-purple-600 text-purple-500 font-black uppercase tracking-wider px-4 py-3 rounded-md flex-1 hover:bg-purple-900/30 transition-colors duration-200">Sign Up</button>
            </div>
            <!-- Error and success messages -->
            <p id="auth-message" class="mt-5 text-sm text-center font-bold whitespace-pre-wrap"></p>
        </div>

        <div id="app-section" class="hidden">
            <div class="flex justify-between items-center mb-8 bg-black p-4 rounded-md border border-purple-900/50">
                <p class="text-sm text-[#C0C0C0]">USER: <span id="user-email" class="font-bold text-purple-400 tracking-wide"></span></p>
                <button onclick="logout()" class="text-[#C0C0C0] text-sm font-bold uppercase hover:text-white transition-colors">Logout</button>
            </div>

            <div class="mb-10 p-6 bg-gradient-to-r from-purple-900/40 to-black border border-purple-700 rounded-md flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h3 class="font-black text-xl text-white uppercase tracking-wider">SimpleList <span class="text-purple-400">Pro</span></h3>
                    <p class="text-sm text-[#C0C0C0] mt-1">Unlock unlimited AI generations.</p>
                </div>
                <button onclick="checkout()" class="bg-white text-black px-6 py-3 rounded-md font-black uppercase tracking-wider hover:bg-[#C0C0C0] transition-colors whitespace-nowrap shadow-[0_0_15px_rgba(255,255,255,0.2)]">Upgrade - $9.99</button>
            </div>

            <div>
                <h2 class="text-xl mb-4 font-bold text-purple-400 uppercase tracking-wide">New Listing</h2>
                
                <select id="category-select" class="w-full bg-black border border-purple-700 text-[#C0C0C0] p-4 mb-4 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-400 font-bold uppercase tracking-wide cursor-pointer hover:border-purple-500 transition-colors">
                    <option value="General">Auto-Detect (General Listing)</option>
                    <option value="Sneakers & Shoes">Sneakers & Shoes</option>
                    <option value="Trading Cards & Collectibles">Trading Cards & Collectibles</option>
                    <option value="Electronics & Computers">Electronics & Computers</option>
                    <option value="Vehicles & Auto Parts">Vehicles & Auto Parts</option>
                    <option value="Clothing & Apparel">Clothing & Apparel</option>
                </select>

                <div class="border-2 border-dashed border-purple-700 hover:border-purple-400 transition-colors bg-black p-8 text-center rounded-md mb-6 flex flex-col items-center justify-center min-h-[200px]">
                    <img id="image-preview" class="hidden max-h-64 object-contain mb-6 rounded-md shadow-[0_0_15px_rgba(147,51,234,0.2)]">
                    <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)" class="w-full cursor-pointer text-[#C0C0C0] file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-bold file:bg-purple-900 file:text-white hover:file:bg-purple-700 transition-colors">
                </div>
                
                <button onclick="generateListing()" class="bg-purple-600 text-white px-4 py-4 rounded-md w-full font-black text-lg uppercase tracking-wider hover:bg-purple-500 transition-colors shadow-[0_0_15px_rgba(128,0,128,0.4)]">Generate AI Listing</button>
            </div>

            <!-- Global Status / Error Message -->
            <div id="status-message" class="mt-8 hidden p-6 border border-purple-800 rounded-md bg-black text-white font-mono text-sm shadow-inner text-center"></div>

            <!-- SMART UI: Segmented Results -->
            <div id="smart-results" class="mt-8 hidden flex-col gap-6">
                
                <!-- Title & Pricing -->
                <div class="p-6 border border-purple-600 bg-black rounded-md relative group">
                    <h4 class="text-xs text-purple-400 font-bold uppercase tracking-widest mb-2">Title & Pricing</h4>
                    <p id="out-title" class="font-bold text-lg mb-2 text-white"></p>
                    <p id="out-pricing" class="text-sm text-green-400 font-mono"></p>
                    <button onclick="copySpecific('out-title', this)" class="mt-4 bg-purple-900 text-white px-3 py-2 rounded text-xs font-bold uppercase hover:bg-purple-700 w-full transition-colors">Copy Title</button>
                </div>

                <!-- Condition & Flaws -->
                <div class="p-6 border border-gray-700 bg-[#0a0a0a] rounded-md">
                    <h4 class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-2">Condition Check</h4>
                    <p id="out-condition" class="text-sm text-gray-300"></p>
                </div>

                <!-- Platform: eBay -->
                <div class="p-6 border border-blue-600 bg-black rounded-md">
                    <h4 class="text-xs text-blue-400 font-bold uppercase tracking-widest mb-2">eBay / Mercari</h4>
                    <p id="out-ebay" class="text-sm text-gray-200 whitespace-pre-wrap mb-4"></p>
                    <button onclick="copySpecific('out-ebay', this)" class="bg-blue-600 text-white px-3 py-3 rounded text-sm font-bold uppercase hover:bg-blue-500 w-full transition-colors">Copy eBay Description</button>
                </div>

                <!-- Platform: Facebook -->
                <div class="p-6 border border-blue-400 bg-black rounded-md">
                    <h4 class="text-xs text-blue-300 font-bold uppercase tracking-widest mb-2">Facebook / OfferUp</h4>
