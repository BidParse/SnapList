<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snaplist - AI Item Lister</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full bg-gray-800 p-8 rounded-xl shadow-2xl border border-gray-700">
        <h1 class="text-3xl font-bold mb-2 text-center text-emerald-400">Snaplist</h1>
        <p class="text-gray-400 text-center mb-6">Snap a photo, get an instant e-commerce listing.</p>
        
        <form id="uploadForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-2">Upload Product Photo</label>
                <input type="file" id="imageInput" accept="image/*" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-500 cursor-pointer">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 font-semibold py-3 px-4 rounded-lg transition duration-200">
                Generate Listing
            </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center text-emerald-400 animate-pulse">
            Analyzing image and writing listing...
        </div>

        <div id="resultContainer" class="hidden mt-6 space-y-4">
            <h2 class="text-xl font-semibold border-b border-gray-700 pb-2">Generated Listing</h2>
            <div class="bg-gray-900 p-4 rounded-lg whitespace-pre-wrap font-mono text-sm text-gray-300" id="resultText"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const resultText = document.getElementById('resultText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('image_file', fileInput.files[0]);

            submitBtn.disabled = true;
            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');

            try {
                const response = await fetch('/api/generate-listing', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                if (response.ok) {
                    resultText.textContent = data.listing;
                    resultContainer.classList.remove('hidden');
                } else {
                    alert('Error generating listing.');
                }
            } catch (err) {
                console.error(err);
                alert('An error occurred.');
            } finally {
                submitBtn.disabled = false;
                loading.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
