<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleList</title>
    <!-- Tailwind CSS is loaded here to give it the dark mode styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-black text-white p-8 font-sans min-h-screen flex flex-col items-center">
    <div class="w-full max-w-2xl bg-[#111111] border border-purple-900 p-10 rounded-xl shadow-[0_0_20px_rgba(128,0,128,0.3)]">
        
        <div class="text-center mb-10">
            <h1 class="text-6xl font-black tracking-wide mb-6"><span class="text-purple-600">Simple</span><span class="text-white">List</span></h1>
            <img src="logo.png" alt="SimpleList Logo" class="h-40 mx-auto object-contain drop-shadow-[0_0_15px_rgba(147,51,234,0.3)]">
            <p class="text-sm text-[#C0C0C0] mt-6 tracking-widest uppercase">AI Marketplace Generator</p>
        </div>

        <div id="auth-section" class="mb-8 pb-8 border-b border-purple-900/50">
            <h2 class="text-xl mb-4 font-bold text-purple-400 uppercase tracking-wide">Account Access</h2>
            <input type="email" id="email" placeholder="Email Address" class="bg-black border border-purple-800 text-white p-4 w-full mb-4 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500">
            <input type="password" id="password" placeholder="Password" class="bg-black border border-purple-800 text-white p-4 w-full mb-6 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-500">
            <div class="flex gap-4">
                <button onclick="login()" class="bg-purple-600 text-white font-black uppercase tracking-wider px-4 py-3 rounded-md flex-1 hover:bg-purple-500 transition-colors duration-200">Login</button>
                <button onclick="signUp()" class="bg-black border border-purple-600 text-purple-500 font-black uppercase tracking-wider px-4 py-3 rounded-md flex-1 hover:bg-purple-900/30 transition-colors duration-200">Sign Up</button>
            </div>
            <!-- Error and success messages will properly display here now -->
            <p id="auth-message" class="mt-5 text-sm text-center font-bold"></p>
        </div>

        <div id="app-section" class="hidden">
            <div class="flex justify-between items-center mb-8 bg-black p-4 rounded-md border border-purple-900/50">
                <p class="text-sm text-[#C0C0C0]">USER: <span id="user-email" class="font-bold text-purple-400 tracking-wide"></span></p>
                <button onclick="logout()" class="text-[#C0C0C0] text-sm font-bold uppercase hover:text-white transition-colors">Logout</button>
            </div>

            <div class="mb-10 p-6 bg-gradient-to-r from-purple-900/40 to-black border border-purple-700 rounded-md flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h3 class="font-black text-xl text-white uppercase tracking-wider">SimpleList <span class="text-purple-400">Pro</span></h3>
                    <p class="text-sm text-[#C0C0C0] mt-1">Unlock unlimited AI generations.</p>
                </div>
                <button onclick="checkout()" class="bg-white text-black px-6 py-3 rounded-md font-black uppercase tracking-wider hover:bg-[#C0C0C0] transition-colors whitespace-nowrap shadow-[0_0_15px_rgba(255,255,255,0.2)]">Upgrade - $9.99</button>
            </div>

            <div>
                <h2 class="text-xl mb-4 font-bold text-purple-400 uppercase tracking-wide">New Listing</h2>
                
                <select id="category-select" class="w-full bg-black border border-purple-700 text-[#C0C0C0] p-4 mb-4 rounded-md focus:outline-none focus:ring-1 focus:ring-purple-400 font-bold uppercase tracking-wide cursor-pointer hover:border-purple-500 transition-colors">
                    <option value="General">Auto-Detect (General Listing)</option>
                    <option value="Sneakers & Shoes">Sneakers & Shoes</option>
                    <option value="Trading Cards & Collectibles">Trading Cards & Collectibles</option>
                    <option value="Electronics & Computers">Electronics & Computers</option>
                    <option value="Vehicles & Auto Parts">Vehicles & Auto Parts</option>
                    <option value="Clothing & Apparel">Clothing & Apparel</option>
                </select>

                <div class="border-2 border-dashed border-purple-700 hover:border-purple-400 transition-colors bg-black p-8 text-center rounded-md mb-6 flex flex-col items-center justify-center min-h-[200px]">
                    <img id="image-preview" class="hidden max-h-64 object-contain mb-6 rounded-md shadow-[0_0_15px_rgba(147,51,234,0.2)]">
                    <input type="file" id="image-upload" accept="image/*" onchange="previewImage(event)" class="w-full cursor-pointer text-[#C0C0C0] file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-bold file:bg-purple-900 file:text-white hover:file:bg-purple-700 transition-colors">
                </div>
                
                <button onclick="generateListing()" class="bg-purple-600 text-white px-4 py-4 rounded-md w-full font-black text-lg uppercase tracking-wider hover:bg-purple-500 transition-colors shadow-[0_0_15px_rgba(128,0,128,0.4)]">Generate AI Listing</button>
            </div>

            <!-- Global Status / Error Message -->
            <div id="status-message" class="mt-8 hidden p-6 border border-purple-800 rounded-md bg-black text-white font-mono text-sm shadow-inner text-center"></div>

            <!-- SMART UI: Segmented Results -->
            <div id="smart-results" class="mt-8 hidden flex-col gap-6">
                
                <!-- Title & Pricing -->
                <div class="p-6 border border-purple-600 bg-black rounded-md relative group">
                    <h4 class="text-xs text-purple-400 font-bold uppercase tracking-widest mb-2">Title & Pricing</h4>
                    <p id="out-title" class="font-bold text-lg mb-2 text-white"></p>
                    <p id="out-pricing" class="text-sm text-green-400 font-mono"></p>
                    <button onclick="copySpecific('out-title', this)" class="mt-4 bg-purple-900 text-white px-3 py-2 rounded text-xs font-bold uppercase hover:bg-purple-700 w-full transition-colors">Copy Title</button>
                </div>

                <!-- Condition & Flaws -->
                <div class="p-6 border border-gray-700 bg-[#0a0a0a] rounded-md">
                    <h4 class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-2">Condition Check</h4>
                    <p id="out-condition" class="text-sm text-gray-300"></p>
                </div>

                <!-- Platform: eBay -->
                <div class="p-6 border border-blue-600 bg-black rounded-md">
                    <h4 class="text-xs text-blue-400 font-bold uppercase tracking-widest mb-2">eBay / Mercari</h4>
                    <p id="out-ebay" class="text-sm text-gray-200 whitespace-pre-wrap mb-4"></p>
                    <button onclick="copySpecific('out-ebay', this)" class="bg-blue-600 text-white px-3 py-3 rounded text-sm font-bold uppercase hover:bg-blue-500 w-full transition-colors">Copy eBay Description</button>
                </div>

                <!-- Platform: Facebook -->
                <div class="p-6 border border-blue-400 bg-black rounded-md">
                    <h4 class="text-xs text-blue-300 font-bold uppercase tracking-widest mb-2">Facebook / OfferUp</h4>
                    <p id="out-facebook" class="text-sm text-gray-200 whitespace-pre-wrap mb-4"></p>
                    <button onclick="copySpecific('out-facebook', this)" class="bg-blue-500 text-white px-3 py-3 rounded text-sm font-bold uppercase hover:bg-blue-400 w-full transition-colors">Copy Facebook Description</button>
                </div>

                <!-- Platform: Poshmark -->
                <div class="p-6 border border-pink-600 bg-black rounded-md">
                    <h4 class="text-xs text-pink-400 font-bold uppercase tracking-widest mb-2">Poshmark / Depop</h4>
                    <p id="out-poshmark" class="text-sm text-gray-200 whitespace-pre-wrap mb-4"></p>
                    <button onclick="copySpecific('out-poshmark', this)" class="bg-pink-600 text-white px-3 py-3 rounded text-sm font-bold uppercase hover:bg-pink-500 w-full transition-colors">Copy Poshmark Description</button>
                </div>

                <!-- Tags -->
                <div class="p-6 border border-gray-600 bg-black rounded-md">
                    <h4 class="text-xs text-gray-400 font-bold uppercase tracking-widest mb-2">SEO Tags</h4>
                    <p id="out-tags" class="text-sm text-gray-300 mb-4"></p>
                    <button onclick="copySpecific('out-tags', this)" class="bg-gray-700 text-white px-3 py-2 rounded text-xs font-bold uppercase hover:bg-gray-600 w-full transition-colors">Copy Tags</button>
                </div>

            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://wzmaaahyovsroeyjsmst.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_7HpG3z67MVak6k9csFWmKQ_7MLqrMyP'; 
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        async function checkUser() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                document.getElementById('user-email').innerText = currentUser.email;
            } else {
                currentUser = null;
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('app-section').classList.add('hidden');
            }
        }

        async function signUp() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('auth-message');
            
            if (!email || !password) {
                messageEl.innerText = "Please enter an email and password.";
                messageEl.className = "mt-5 text-sm text-center font-bold text-red-500";
                return;
            }

            messageEl.innerText = "SIGNING UP...";
            messageEl.className = "mt-5 text-sm text-center font-bold text-purple-400 uppercase tracking-wider";
            
            const { data, error } = await supabaseClient.auth.signUp({ email, password });
            
            if (error) {
                messageEl.innerText = error.message.toUpperCase();
                messageEl.className = "mt-5 text-sm text-center font-bold text-red-500 tracking-wide";
            } else {
                messageEl.innerText = "SUCCESS! PLEASE LOG IN.";
                messageEl.className = "mt-5 text-sm text-center font-bold text-green-400 uppercase tracking-wider";
            }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const messageEl = document.getElementById('auth-message');
            
            if (!email || !password) {
                messageEl.innerText = "Please enter an email and password.";
                messageEl.className = "mt-5 text-sm text-center font-bold text-red-500";
                return;
            }

            messageEl.innerText = "LOGGING IN...";
            messageEl.className = "mt-5 text-sm text-center font-bold text-purple-400 uppercase tracking-wider";
            
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            
            if (error) {
                messageEl.innerText = error.message.toUpperCase();
                messageEl.className = "mt-5 text-sm text-center font-bold text-red-500 tracking-wide";
            } else {
                messageEl.innerText = "";
                checkUser();
            }
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            checkUser();
        }

        async function checkout() {
            if (!currentUser) return alert("Please log in first!");
            try {
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: currentUser.id })
                });
                const data = await response.json();
                if (data.url) window.location.href = data.url; 
                else alert("Error starting checkout");
            } catch (err) {
                alert("Payment system unavailable right now.");
            }
        }

        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('image-preview');
                output.src = reader.result;
                output.classList.remove('hidden');
            };
            if (event.target.files[0]) reader.readAsDataURL(event.target.files[0]);
        }

        function copySpecific(elementId, btnElement) {
            const textToCopy = document.getElementById(elementId).innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = btnElement.innerHTML;
                const originalClasses = btnElement.className;
                
                btnElement.innerHTML = '✅ COPIED!';
                btnElement.className = 'bg-green-500 text-white px-3 py-3 rounded text-sm font-bold uppercase w-full transition-colors';
                
                setTimeout(() => {
                    btnElement.innerHTML = originalText;
                    btnElement.className = originalClasses;
                }, 2000);
            });
        }

        async function generateListing() {
            if (!currentUser) return alert("Please log in to generate a listing!");

            const fileInput = document.getElementById('image-upload');
            const categorySelect = document.getElementById('category-select');
            const statusMsg = document.getElementById('status-message');
            const smartResults = document.getElementById('smart-results');
            
            if (!fileInput.files.length) return alert("Please select an image first!");
            
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            formData.append('category', categorySelect.value);
            formData.append('user_id', currentUser.id);

            statusMsg.classList.remove('hidden');
            smartResults.classList.add('hidden');
            statusMsg.innerText = "ANALYZING IMAGE & GENERATING NICHE LISTING... ⏳";
            statusMsg.className = "mt-8 p-6 border border-purple-800 rounded-md bg-black text-purple-400 font-bold font-mono text-sm shadow-inner text-center";

            try {
                const response = await fetch('/api/generate-listing', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                if (data.result) {
                    try {
                        let cleanJson = data.result.replace(/```json/gi, '').replace(/```/gi, '').trim();
                        const parsed = JSON.parse(cleanJson);
                        
                        document.getElementById('out-title').innerText = parsed.title || "No title generated";
                        document.getElementById('out-pricing').innerText = parsed.pricing || "Pricing unavailable";
                        document.getElementById('out-condition').innerText = parsed.condition || "N/A";
                        document.getElementById('out-ebay').innerText = parsed.ebay || "N/A";
                        document.getElementById('out-facebook').innerText = parsed.facebook || "N/A";
                        document.getElementById('out-poshmark').innerText = parsed.poshmark || "N/A";
                        document.getElementById('out-tags').innerText = parsed.tags || "N/A";
                        
                        statusMsg.classList.add('hidden');
                        smartResults.classList.remove('hidden');
                        smartResults.classList.add('flex');
                    } catch (parseError) {
                        statusMsg.innerText = "🚨 Error formatting the response. Please try again.";
                        statusMsg.className = "mt-8 p-6 border border-red-800 rounded-md bg-[#1a0505] text-red-400 font-bold font-mono text-sm shadow-[0_0_15px_rgba(255,0,0,0.2)] text-center";
                    }
                } else {
                    statusMsg.innerText = "🚨 " + data.error;
                    statusMsg.className = "mt-8 p-6 border border-red-800 rounded-md bg-[#1a0505] text-red-400 font-bold font-mono text-sm shadow-[0_0_15px_rgba(255,0,0,0.2)] text-center";
                }
            } catch (e) {
                statusMsg.innerText = "A CONNECTION ERROR OCCURRED.";
            }
        }

        checkUser();
    </script>
</body>
</html>
