<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplyList - AI Product Lister</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-gray-100 min-h-screen flex flex-col items-center justify-center p-6">
    <div class="max-w-xl w-full bg-gray-900 p-8 rounded-2xl shadow-2xl border border-purple-900/50">
        <div class="flex items-center justify-center space-x-3 mb-2">
            <svg class="w-10 h-10 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <h1 class="text-3xl font-extrabold text-white tracking-wide">Simply<span class="text-purple-500">List</span></h1>
        </div>
        <p class="text-gray-400 text-center mb-6">Snap a photo and instantly generate your e-commerce listing.</p>
        
        <form id="uploadForm" class="space-y-4">
            <div class="border-2 border-dashed border-gray-700 rounded-xl p-6 text-center hover:border-purple-500 transition duration-200 bg-gray-800/50">
                <input type="file" id="imageInput" accept="image/*" required class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer">
            </div>
            
            <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition duration-200">
                Generate Listing
            </button>
        </form>

        <div id="loading" class="hidden mt-6 text-center text-purple-400 animate-pulse font-medium">
            Analyzing product photo with AI...
        </div>

        <div id="resultContainer" class="hidden mt-8 space-y-4 border-t border-gray-800 pt-6">
            <h2 class="text-xl font-bold text-white">Generated Listing</h2>
            
            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Title</label>
                <div id="resTitle" class="bg-gray-800 p-3 rounded-lg text-gray-200 select-all border border-gray-700"></div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Price Estimate</label>
                <div id="resPrice" class="bg-gray-800 p-3 rounded-lg text-purple-400 font-bold select-all border border-gray-700"></div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Description</label>
                <div id="resDesc" class="bg-gray-800 p-3 rounded-lg text-gray-300 select-all text-sm whitespace-pre-wrap border border-gray-700"></div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const loading = document.getElementById('loading');
        const resultContainer = document.getElementById('resultContainer');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('imageInput');
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('image_file', fileInput.files[0]);

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/generate-listing', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                // Simple parser for the AI response
                const text = data.listing;
                document.getElementById('resTitle').innerText = text.match(/TITLE:\s*(.*)/i)?.[1] || "See description";
                document.getElementById('resPrice').innerText = text.match(/PRICE ESTIMATE:\s*(.*)/i)?.[1] || "Market rate";
                document.getElementById('resDesc').innerText = text.match(/DESCRIPTION:\s*([\s\S]*)/i)?.[1] || text;

                resultContainer.classList.remove('hidden');
            } catch (err) {
                alert('Error generating listing. Please try again.');
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
