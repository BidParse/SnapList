import os
import stripe
from fastapi import FastAPI, Request, HTTPException, UploadFile, File
from fastapi.responses import HTMLResponse, JSONResponse, FileResponse
from fastapi.middleware.cors import CORSMiddleware
from google import genai
from google.genai import types
from supabase import create_client, Client

# Initialize app
app = FastAPI()

app.add_middleware(
    CORSMiddleware,
    allow_origins=["*"],
    allow_credentials=True,
    allow_methods=["*"],
    allow_headers=["*"],
)

# Load Environment Variables
SUPABASE_URL = os.getenv("SUPABASE_URL")
SUPABASE_KEY = os.getenv("SUPABASE_SERVICE_KEY")
STRIPE_SECRET_KEY = os.getenv("STRIPE_SECRET_KEY")
STRIPE_WEBHOOK_SECRET = os.getenv("STRIPE_WEBHOOK_SECRET")
GEMINI_API_KEY = os.getenv("GEMINI_API_KEY")

# Initialize Services
supabase: Client = None
if SUPABASE_URL and SUPABASE_KEY:
    supabase = create_client(SUPABASE_URL, SUPABASE_KEY)

if STRIPE_SECRET_KEY:
    stripe.api_key = STRIPE_SECRET_KEY

gemini_client = None
if GEMINI_API_KEY:
    gemini_client = genai.Client(api_key=GEMINI_API_KEY)

@app.get("/", response_class=HTMLResponse)

@app.post("/api/generate-listing")
async def generate_listing(image: UploadFile = File(...)):
    if not gemini_client:
        raise HTTPException(status_code=500, detail="Gemini API Key missing")
    
    try:
        image_data = await image.read()
        
        # The Master E-Commerce Super Prompt
        prompt = """You are an expert e-commerce copywriter, appraiser, and SEO specialist. Analyze this product image and generate a premium, ready-to-post marketplace listing that will sell quickly.

        Format the response perfectly so the user can copy and paste it directly. Include:
        
        🏷️ TITLE: A catchy, highly-searchable SEO title (include brand/style if identifiable).
        💰 FAIR MARKET VALUE: A realistic estimated price range based on the secondhand market.
        📝 DESCRIPTION: A highly engaging, persuasive, and detailed sales description. Write it as if you are trying to make a sale today.
        ✨ FEATURES & DETAILS: 3-5 bullet points outlining the visible condition, material, or standout features.
        🔍 SEO TAGS: 10-15 comma-separated keywords perfect for eBay, Facebook Marketplace, or Poshmark algorithms.
        """
        
        response = gemini_client.models.generate_content(
            model='gemini-3.8-flash',
            contents=[
                prompt,
                types.Part.from_bytes(data=image_data, mime_type=image.content_type)
            ]
        )
        
        return JSONResponse(content={"result": response.text})
        
    except Exception as e:
        return JSONResponse(content={"error": str(e)}, status_code=500)

@app.post("/api/checkout")
async def create_checkout_session(request: Request):
    try:
        data = await request.json()
        user_id = data.get("user_id", "guest")

        session = stripe.checkout.Session.create(
            payment_method_types=['card'],
            line_items=[{
                'price_data': {
                    'currency': 'usd',
                    'product_data': {'name': 'SimpleList Pro'},
                    'unit_amount': 999,
                },
                'quantity': 1,
            }],
            mode='payment',
            success_url=str(request.base_url) + "?success=true",
            cancel_url=str(request.base_url) + "?canceled=true",
            client_reference_id=user_id
        )
        return {"url": session.url}
    except Exception as e:
        raise HTTPException(status_code=500, detail=str(e))

@app.post("/api/webhook/stripe")
async def stripe_webhook(request: Request):
    payload = await request.body()
    sig_header = request.headers.get("stripe-signature")

    try:
        event = stripe.Webhook.construct_event(
            payload, sig_header, STRIPE_WEBHOOK_SECRET
        )
    except ValueError:
        raise HTTPException(status_code=400, detail="Invalid payload")
    except stripe.error.SignatureVerificationError:
        raise HTTPException(status_code=400, detail="Invalid signature")

    if event["type"] == "checkout.session.completed":
        session = event["data"]["object"]
        user_id = session.get("client_reference_id")

        if user_id and user_id != "guest" and supabase:
            try:
                supabase.table("profiles").update({"is_pro": True}).eq("id", user_id).execute()
            except Exception as db_error:
                print("Supabase update error:", db_error)

    return {"status": "success"}
